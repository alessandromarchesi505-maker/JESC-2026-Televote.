# Free hosting with Cloudflare Workers + built-in durable SQLite storage.
# NO database ID, separate D1 database, or paid hosting required.
name = "jesc-2026-televote"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "VOTING"
class_name = "VotingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VotingRoom"]
